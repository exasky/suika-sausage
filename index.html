<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Suika Sausage Game - Precise Physics</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
        transition: background 0.3s ease;
      }
      body.light-theme {
        background: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <script>
      const SAUSAGE_TYPES = [
        { key: '1_cocktail', name: 'Cocktail', radius: 16, score: 1 },
        { key: '2_merguez', name: 'Merguez', radius: 24, score: 3 },
        { key: '3_chipolata', name: 'Chipolata', radius: 32, score: 6 },
        { key: '4_francfort', name: 'Francfort', radius: 42, score: 10 },
        { key: '5_diot', name: 'Diot', radius: 54, score: 15 },
        { key: '6_montbeliard', name: 'Montbéliard', radius: 68, score: 21 },
        { key: '7_toulouse', name: 'Toulouse', radius: 84, score: 28 },
        { key: '8_boudin', name: 'Boudin Noir', radius: 102, score: 36 },
        { key: '9_morteau', name: 'Morteau', radius: 122, score: 45 },
        { key: '10_jesus', name: 'Jésus', radius: 144, score: 55 },
        { key: '11_mortadelle', name: 'Mortadelle', radius: 168, score: 66 },
      ];

      let currentTypeIndex = 0;
      let nextTypeIndex = 0;
      let currentSausageSprite = null;
      let nextSausagePreview = null;
      let aimLine = null;
      let canDrop = true;
      let score = 0;
      let highScore = localStorage.getItem('sausage_high_score') || 0;
      let scoreText, highScoreText, sausNameText, themeBtnText;
      let gameOver = false;
      let overflowTimer = 0;
      let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      const BOARD_WIDTH = 340;
      const CANVAS_WIDTH = 480;
      const GAME_HEIGHT = 620;
      const GAME_OVER_LINE_Y = 110;

      let bgContainer, uiBg, nextBox;

      const config = {
        type: Phaser.AUTO,
        width: CANVAS_WIDTH,
        height: GAME_HEIGHT,
        backgroundColor: '#181412',
        physics: {
          default: 'matter',
          matter: {
            gravity: { y: 2.0 },
            positionIterations: 10,
            velocityIterations: 10,
            debug: false,
          },
        },
        scene: {
          preload: preload,
          create: create,
          update: update,
        },
      };

      const game = new Phaser.Game(config);

      function preload() {
        SAUSAGE_TYPES.forEach((type) => {
          this.load.image(type.key, `assets/${type.key}.png`);
        });
        this.load.json('physics_shapes', 'physics.json');
      }

      function create() {
        gameOver = false;
        canDrop = true;
        score = 0;
        overflowTimer = 0;

        this.matter.world.setBounds(0, 0, BOARD_WIDTH, GAME_HEIGHT, 32, true, true, false, true);

        bgContainer = this.add.graphics();
        uiBg = this.add.graphics();
        nextBox = this.add.graphics();

        const nextLabel = this.add.text(BOARD_WIDTH + 15, 65, 'SUIVANTE', { fontSize: '12px', fontStyle: 'bold' });
        const scoreLabel = this.add.text(BOARD_WIDTH + 15, 215, 'SCORE', { fontSize: '12px', fontStyle: 'bold' });
        scoreText = this.add.text(BOARD_WIDTH + 15, 235, '0', { fontSize: '24px', fontStyle: 'bold' });

        const highLabel = this.add.text(BOARD_WIDTH + 15, 285, 'MEILLEUR', { fontSize: '12px', fontStyle: 'bold' });
        highScoreText = this.add.text(BOARD_WIDTH + 15, 305, highScore, { fontSize: '18px' });

        sausNameText = this.add.text(BOARD_WIDTH + 15, 360, '', {
          fontSize: '14px',
          fontStyle: 'bold',
          wordWrap: { width: 110 },
        });

        themeBtnText = this.add
          .text(BOARD_WIDTH + 15, 15, ' 🌙 DARK ', {
            fontSize: '13px',
            fontStyle: 'bold',
            padding: { x: 10, y: 6 },
          })
          .setInteractive({ useHandCursor: true });

        themeBtnText.on('pointerdown', () => {
          isDarkMode = !isDarkMode;
          applyTheme(this, nextLabel, scoreLabel, highLabel);
        });

        const line = this.add.graphics();
        line.lineStyle(2, 0xff3333, 0.6);
        line.lineTo(BOARD_WIDTH, 0);
        line.y = GAME_OVER_LINE_Y;

        aimLine = this.add.graphics();

        applyTheme(this, nextLabel, scoreLabel, highLabel);

        nextTypeIndex = getRandomNextIndex();
        spawnNextSausage(this);

        this.input.on('pointermove', (pointer) => {
          if (canDrop && currentSausageSprite && !gameOver) {
            const currentRadius = SAUSAGE_TYPES[currentTypeIndex].radius;
            const minX = currentRadius + 5;
            const maxX = BOARD_WIDTH - currentRadius - 5;
            currentSausageSprite.x = Phaser.Math.Clamp(pointer.x, minX, maxX);
          }
        });

        this.input.on('pointerdown', (pointer) => {
          if (pointer.x > BOARD_WIDTH || !canDrop || gameOver) return;

          canDrop = false;
          const dropX = currentSausageSprite.x;

          currentSausageSprite.destroy();
          aimLine.clear();

          createPhysicsSausage(this, dropX, 60, currentTypeIndex);

          this.time.delayedCall(450, () => {
            if (!gameOver) {
              spawnNextSausage(this);
              canDrop = true;
            }
          });
        });

        this.matter.world.on('collisionstart', (event) => {
          event.pairs.forEach((pair) => {
            const bodyA = pair.bodyA;
            const bodyB = pair.bodyB;

            const parentA = bodyA.parent || bodyA;
            const parentB = bodyB.parent || bodyB;

            if (parentA.sausageTypeIndex !== undefined && parentB.sausageTypeIndex !== undefined) {
              if (parentA.sausageTypeIndex === parentB.sausageTypeIndex) {
                const currentIndex = parentA.sausageTypeIndex;

                if (currentIndex < SAUSAGE_TYPES.length - 1) {
                  if (parentA.isMarkedForDelete || parentB.isMarkedForDelete) return;
                  parentA.isMarkedForDelete = true;
                  parentB.isMarkedForDelete = true;

                  const newX = (parentA.position.x + parentB.position.x) / 2;
                  const newY = (parentA.position.y + parentB.position.y) / 2;
                  const nextIndex = currentIndex + 1;

                  score += SAUSAGE_TYPES[nextIndex].score;
                  scoreText.setText(score);
                  if (score > highScore) {
                    highScore = score;
                    highScoreText.setText(highScore);
                    localStorage.setItem('sausage_high_score', highScore);
                  }

                  destroySausageBody(this, parentA);
                  destroySausageBody(this, parentB);

                  this.time.delayedCall(20, () => {
                    createPhysicsSausage(this, newX, newY, nextIndex);
                  });
                }
              }
            }
          });
        });
      }

      function applyTheme(scene, nextLabel, scoreLabel, highLabel) {
        document.body.classList.toggle('light-theme', !isDarkMode);

        const colors = isDarkMode
          ? {
              bgBoard: 0x231e1a,
              uiBg: 0x110e0d,
              border: 0x3a312b,
              boxStroke: 0x443932,
              label: '#888888',
              scoreText: '#ffca28',
              highText: '#ffffff',
              nameText: '#ff8a65',
              btnBg: '#2a2421',
              btnText: '#ffffff',
              btnLabel: ' 🌙 DARK ',
            }
          : {
              bgBoard: 0xf5f2eb,
              uiBg: 0xe8e2d8,
              border: 0xc8bfb0,
              boxStroke: 0xbaa896,
              label: '#666666',
              scoreText: '#d84315',
              highText: '#222222',
              nameText: '#bf360c',
              btnBg: '#ffffff',
              btnText: '#222222',
              btnLabel: ' ☀️ LIGHT ',
            };

        bgContainer.clear();
        bgContainer.fillStyle(colors.bgBoard, 1);
        bgContainer.fillRect(0, 0, BOARD_WIDTH, GAME_HEIGHT);

        uiBg.clear();
        uiBg.fillStyle(colors.uiBg, 1);
        uiBg.fillRect(BOARD_WIDTH, 0, CANVAS_WIDTH - BOARD_WIDTH, GAME_HEIGHT);
        uiBg.lineStyle(2, colors.border, 1);
        uiBg.strokeLineShape(new Phaser.Geom.Line(BOARD_WIDTH, 0, BOARD_WIDTH, GAME_HEIGHT));

        nextBox.clear();
        nextBox.lineStyle(2, colors.boxStroke, 1);
        nextBox.strokeRoundedRect(BOARD_WIDTH + 15, 85, 110, 110, 8);

        nextLabel.setColor(colors.label);
        scoreLabel.setColor(colors.label);
        highLabel.setColor(colors.label);

        scoreText.setColor(colors.scoreText);
        highScoreText.setColor(colors.highText);
        sausNameText.setColor(colors.nameText);

        themeBtnText.setText(colors.btnLabel);
        themeBtnText.setColor(colors.btnText);
        themeBtnText.setBackgroundColor(colors.btnBg);
      }

      function update(time, delta) {
        if (gameOver) return;

        if (canDrop && currentSausageSprite) {
          aimLine.clear();
          const lineColor = isDarkMode ? 0xffffff : 0x000000;
          aimLine.lineStyle(1, lineColor, 0.3);
          const startY = 60 + SAUSAGE_TYPES[currentTypeIndex].radius;
          for (let y = startY; y < GAME_HEIGHT; y += 12) {
            aimLine.lineBetween(currentSausageSprite.x, y, currentSausageSprite.x, y + 6);
          }
        }

        const bodies = this.matter.world.getAllBodies();
        let isOverflowing = false;

        bodies.forEach((body) => {
          if (body.sausageTypeIndex !== undefined) {
            if (body.gameObject) {
              body.gameObject.x = body.position.x;
              body.gameObject.y = body.position.y;
              body.gameObject.rotation = body.angle;
            }

            if (body.speed < 0.3) {
              const topY = body.position.y - SAUSAGE_TYPES[body.sausageTypeIndex].radius;
              if (topY < GAME_OVER_LINE_Y) {
                isOverflowing = true;
              }
            }
          }
        });

        if (isOverflowing) {
          overflowTimer += delta;
          if (overflowTimer > 1500) {
            triggerGameOver(this);
          }
        } else {
          overflowTimer = 0;
        }
      }

      function getRandomNextIndex() {
        return Math.floor(Math.random() * 4);
      }

      function spawnNextSausage(scene) {
        currentTypeIndex = nextTypeIndex;
        nextTypeIndex = getRandomNextIndex();

        const typeInfo = SAUSAGE_TYPES[currentTypeIndex];
        if (sausNameText) sausNameText.setText(typeInfo.name);

        if (nextSausagePreview) nextSausagePreview.destroy();
        const nextInfo = SAUSAGE_TYPES[nextTypeIndex];
        nextSausagePreview = scene.add.image(BOARD_WIDTH + 70, 140, nextInfo.key);

        const maxPreviewSize = 80;
        const maxDimension = Math.max(nextSausagePreview.width, nextSausagePreview.height);
        nextSausagePreview.setScale(maxPreviewSize / maxDimension);

        currentSausageSprite = createPreviewSprite(scene, typeInfo);

        const pointer = scene.input.activePointer;
        const currentRadius = typeInfo.radius;
        const minX = currentRadius + 5;
        const maxX = BOARD_WIDTH - currentRadius - 5;
        const initialX =
          pointer && pointer.x > 0 && pointer.x < BOARD_WIDTH
            ? Phaser.Math.Clamp(pointer.x, minX, maxX)
            : BOARD_WIDTH / 2;

        currentSausageSprite.x = initialX;
        currentSausageSprite.y = 60;
      }

      function createPreviewSprite(scene, typeInfo) {
        const sprite = scene.add.image(0, 0, typeInfo.key);
        const targetSize = typeInfo.radius * 2;
        const maxDim = Math.max(sprite.width, sprite.height);
        sprite.setScale(targetSize / maxDim);
        return sprite;
      }

      function createPhysicsSausage(scene, x, y, typeIndex) {
        const typeInfo = SAUSAGE_TYPES[typeIndex];
        const targetSize = typeInfo.radius * 2;

        const shapes = scene.cache.json.get('physics_shapes');
        const shapeData = shapes ? shapes[typeInfo.key] : null;

        let sprite;

        if (shapeData) {
          sprite = scene.matter.add.sprite(x, y, typeInfo.key, null, {
            shape: shapeData,
            restitution: 0.1,
            friction: 0.2,
            frictionStatic: 0.8,
            density: 0.003,
          });

          const frame = scene.textures.getFrame(typeInfo.key);
          const maxDim = Math.max(frame.width, frame.height);
          const scale = targetSize / maxDim;

          sprite.setBody(shapeData, {
            scale: { x: scale, y: scale },
          });
          sprite.setScale(scale);
        } else {
          const tempTexture = scene.textures.get(typeInfo.key).getSourceImage();
          const aspect = tempTexture.width / tempTexture.height;

          let boxWidth, boxHeight;
          if (aspect >= 1) {
            boxWidth = targetSize;
            boxHeight = targetSize / aspect;
          } else {
            boxHeight = targetSize;
            boxWidth = targetSize * aspect;
          }

          const chamferRadius = Math.min(boxWidth, boxHeight) / 2;
          const body = scene.matter.add.rectangle(x, y, boxWidth, boxHeight, {
            chamfer: { radius: chamferRadius },
            restitution: 0.1,
            friction: 0.2,
            density: 0.003,
          });

          sprite = scene.add.image(x, y, typeInfo.key);
          sprite.setDisplaySize(boxWidth, boxHeight);
          body.gameObject = sprite;

          body.sausageTypeIndex = typeIndex;
          return body;
        }

        sprite.body.sausageTypeIndex = typeIndex;
        sprite.body.gameObject = sprite;

        return sprite.body;
      }

      function destroySausageBody(scene, body) {
        const gameObject = body.gameObject || (body.parent ? body.parent.gameObject : null);
        if (gameObject) {
          gameObject.destroy();
        }
        scene.matter.world.remove(body);
      }

      function triggerGameOver(scene) {
        gameOver = true;
        aimLine.clear();

        const overlay = scene.add.graphics();
        overlay.fillStyle(0x000000, 0.75);
        overlay.fillRect(0, 0, CANVAS_WIDTH, GAME_HEIGHT);

        scene.add.text(BOARD_WIDTH / 2 - 90, GAME_HEIGHT / 2 - 70, 'GAME OVER', {
          fontSize: '32px',
          fill: '#ff4444',
          fontStyle: 'bold',
        });

        scene.add.text(BOARD_WIDTH / 2 - 60, GAME_HEIGHT / 2 - 20, 'Score: ' + score, {
          fontSize: '22px',
          fill: '#ffffff',
        });

        const restartBtn = scene.add
          .text(BOARD_WIDTH / 2 - 65, GAME_HEIGHT / 2 + 40, ' REJOUER ', {
            fontSize: '20px',
            fill: '#181412',
            backgroundColor: '#ffca28',
            padding: { x: 15, y: 10 },
          })
          .setInteractive({ useHandCursor: true });

        restartBtn.on('pointerdown', () => {
          scene.scene.restart();
        });
      }
    </script>
  </body>
</html>
