<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suika Sausage Game - High Resolution Centered</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
        transition: background 0.3s ease;
      }
      body.light-theme {
        background: #e0e0e0;
      }
      /* S'assure que le canvas généré par Phaser ne déborde pas du body Flex */
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <script>
      // Facteur de résolution (HiDPI / Retina). 2 = Résolution doublée (Ultra Net)
      const SCALE = 2;

      const BASE_SAUSAGE_TYPES = [
        { key: '1_cocktail', name: 'Cocktail', radius: 14, score: 1 },
        { key: '2_merguez', name: 'Merguez', radius: 20, score: 3 },
        { key: '3_chipolata', name: 'Chipolata', radius: 28, score: 6 },
        { key: '4_francfort', name: 'Francfort', radius: 38, score: 10 },
        { key: '5_diot', name: 'Diot', radius: 48, score: 15 },
        { key: '6_montbeliard', name: 'Montbéliard', radius: 60, score: 21 },
        { key: '7_toulouse', name: 'Toulouse', radius: 73, score: 28 },
        { key: '8_boudin', name: 'Boudin Noir', radius: 86, score: 36 },
        { key: '9_morteau', name: 'Morteau', radius: 98, score: 45 },
        { key: '10_jesus', name: 'Jésus', radius: 110, score: 55 },
        { key: '11_mortadelle', name: 'Mortadelle', radius: 125, score: 66 },
      ];

      const SAUSAGE_TYPES = BASE_SAUSAGE_TYPES.map((type) => ({
        ...type,
        radius: type.radius * SCALE,
      }));

      // Dimensions virtuelles haute définition
      const BOARD_WIDTH = 340 * SCALE;
      const CANVAS_WIDTH = 480 * SCALE;
      const GAME_HEIGHT = 620 * SCALE;
      const GAME_OVER_LINE_Y = 110 * SCALE;

      let currentTypeIndex = 0;
      let nextTypeIndex = 0;
      let currentSausageSprite = null;
      let nextSausagePreview = null;
      let aimLine = null;
      let gameOverLine = null;
      let canDrop = true;
      let score = 0;
      let highScore = localStorage.getItem('sausage_high_score') || 0;
      let scoreText, highScoreText, sausNameText, themeBtnText, soundBtnText;
      let gameOver = false;
      let overflowTimer = 0;
      let bgMusic = null;
      let isMuted = false;

      let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      let bgContainer, uiBg, nextBox;
      let nextLabel, scoreLabel, highLabel;

      const config = {
        type: Phaser.AUTO,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH, // Centrage automatique Phaser (X & Y)
          width: CANVAS_WIDTH,
          height: GAME_HEIGHT,
        },
        backgroundColor: '#181412',
        physics: {
          default: 'matter',
          matter: {
            gravity: { y: 1.5 * SCALE },
            runner: { isFixed: true, fps: 120 },
            positionIterations: 20,
            velocityIterations: 20,
            constraintIterations: 10,
            debug: false,
          },
        },
        scene: {
          preload: preload,
          create: create,
          update: update,
        },
      };

      const game = new Phaser.Game(config);

      function preload() {
        SAUSAGE_TYPES.forEach((type) => {
          this.load.image(type.key, `assets/${type.key}.png`);
        });
        this.load.json('physics_shapes', 'physics.json');
        this.load.audio('bgm', 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3');
      }

      function create() {
        gameOver = false;
        canDrop = true;
        score = 0;
        overflowTimer = 0;

        this.matter.world.setBounds(0, 0, BOARD_WIDTH, GAME_HEIGHT, 32 * SCALE, true, true, false, true);

        if (!bgMusic) {
          bgMusic = this.sound.add('bgm', { volume: 0.25, loop: true });
        }
        if (!bgMusic.isPlaying && !isMuted) {
          this.sound.unlock();
          bgMusic.play();
        }

        bgContainer = this.add.graphics();
        uiBg = this.add.graphics();
        nextBox = this.add.graphics();

        const fontS = `${12 * SCALE}px`;
        const fontM = `${14 * SCALE}px`;
        const fontL = `${18 * SCALE}px`;
        const fontXL = `${24 * SCALE}px`;

        nextLabel = this.add.text(BOARD_WIDTH + 15 * SCALE, 85 * SCALE, 'SUIVANTE', {
          fontSize: fontS,
          fontStyle: 'bold',
        });
        scoreLabel = this.add.text(BOARD_WIDTH + 15 * SCALE, 235 * SCALE, 'SCORE', {
          fontSize: fontS,
          fontStyle: 'bold',
        });
        scoreText = this.add.text(BOARD_WIDTH + 15 * SCALE, 255 * SCALE, '0', { fontSize: fontXL, fontStyle: 'bold' });

        highLabel = this.add.text(BOARD_WIDTH + 15 * SCALE, 305 * SCALE, 'MEILLEUR', {
          fontSize: fontS,
          fontStyle: 'bold',
        });
        highScoreText = this.add.text(BOARD_WIDTH + 15 * SCALE, 325 * SCALE, highScore, { fontSize: fontL });

        sausNameText = this.add
          .text(BOARD_WIDTH + 15 * SCALE, 380 * SCALE, '', { fontSize: fontM, fontStyle: 'bold' })
          .setWordWrapWidth(110 * SCALE);

        themeBtnText = this.add
          .text(BOARD_WIDTH + 15 * SCALE, 12 * SCALE, '', { fontSize: fontS, fontStyle: 'bold' })
          .setPadding(8 * SCALE, 5 * SCALE)
          .setInteractive({ useHandCursor: true });

        themeBtnText.on('pointerdown', () => {
          isDarkMode = !isDarkMode;
          applyTheme(this);
        });

        soundBtnText = this.add
          .text(BOARD_WIDTH + 15 * SCALE, 45 * SCALE, ' 🔊 SON ', { fontSize: fontS, fontStyle: 'bold' })
          .setPadding(8 * SCALE, 5 * SCALE)
          .setInteractive({ useHandCursor: true });

        soundBtnText.on('pointerdown', () => {
          isMuted = !isMuted;
          this.sound.mute = isMuted;
          soundBtnText.setText(isMuted ? ' 🔇 MUET ' : ' 🔊 SON ');
        });

        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            isDarkMode = e.matches;
            applyTheme(this);
          });
        }

        gameOverLine = this.add.graphics();
        gameOverLine.lineStyle(2 * SCALE, 0xff3333, 0.6);
        gameOverLine.lineTo(BOARD_WIDTH, 0);
        gameOverLine.y = GAME_OVER_LINE_Y;

        aimLine = this.add.graphics();

        applyTheme(this);

        nextTypeIndex = getRandomNextIndex();
        spawnNextSausage(this);

        this.input.on('pointermove', (pointer) => {
          if (canDrop && currentSausageSprite && !gameOver) {
            const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
            const currentRadius = SAUSAGE_TYPES[currentTypeIndex].radius;
            const minX = currentRadius + 5 * SCALE;
            const maxX = BOARD_WIDTH - currentRadius - 5 * SCALE;
            currentSausageSprite.x = Phaser.Math.Clamp(worldPoint.x, minX, maxX);
          }
        });

        this.input.on('pointerdown', (pointer) => {
          const worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
          if (worldPoint.x > BOARD_WIDTH || !canDrop || gameOver) return;

          if (this.sound.context.state === 'suspended') {
            this.sound.context.resume();
          }

          canDrop = false;
          const dropX = currentSausageSprite.x;

          currentSausageSprite.destroy();
          aimLine.clear();

          createPhysicsSausage(this, dropX, 60 * SCALE, currentTypeIndex);

          this.time.delayedCall(450, () => {
            if (!gameOver) {
              spawnNextSausage(this);
              canDrop = true;
            }
          });
        });

        this.matter.world.on('collisionstart', (event) => {
          event.pairs.forEach((pair) => {
            const bodyA = pair.bodyA.parent || pair.bodyA;
            const bodyB = pair.bodyB.parent || pair.bodyB;

            if (bodyA.sausageTypeIndex !== undefined && bodyB.sausageTypeIndex !== undefined) {
              if (bodyA.sausageTypeIndex === bodyB.sausageTypeIndex) {
                const currentIndex = bodyA.sausageTypeIndex;

                if (bodyA.isMarkedForDelete || bodyB.isMarkedForDelete) return;
                bodyA.isMarkedForDelete = true;
                bodyB.isMarkedForDelete = true;

                if (currentIndex < SAUSAGE_TYPES.length - 1) {
                  const newX = (bodyA.position.x + bodyB.position.x) / 2;
                  const newY = (bodyA.position.y + bodyB.position.y) / 2;
                  const nextIndex = currentIndex + 1;

                  score += SAUSAGE_TYPES[nextIndex].score;
                  updateScoreDisplay();

                  destroySausageBody(this, bodyA);
                  destroySausageBody(this, bodyB);

                  this.time.delayedCall(20, () => {
                    createPhysicsSausage(this, newX, newY, nextIndex);
                  });
                } else {
                  score += SAUSAGE_TYPES[currentIndex].score * 2;
                  updateScoreDisplay();

                  destroySausageBody(this, bodyA);
                  destroySausageBody(this, bodyB);
                }
              }
            }
          });
        });
      }

      function updateScoreDisplay() {
        scoreText.setText(score);
        if (score > highScore) {
          highScore = score;
          highScoreText.setText(highScore);
          localStorage.setItem('sausage_high_score', highScore);
        }
      }

      function applyTheme(scene) {
        document.body.classList.toggle('light-theme', !isDarkMode);

        const colors = isDarkMode
          ? {
              bgBoard: 0x231e1a,
              uiBg: 0x110e0d,
              border: 0x3a312b,
              boxStroke: 0x443932,
              label: '#888888',
              scoreText: '#ffca28',
              highText: '#ffffff',
              nameText: '#ff8a65',
              btnBg: '#2a2421',
              btnText: '#ffffff',
              btnLabel: ' 🌙 DARK ',
            }
          : {
              bgBoard: 0xf5f2eb,
              uiBg: 0xe8e2d8,
              border: 0xc8bfb0,
              boxStroke: 0xbaa896,
              label: '#666666',
              scoreText: '#d84315',
              highText: '#222222',
              nameText: '#bf360c',
              btnBg: '#ffffff',
              btnText: '#222222',
              btnLabel: ' ☀️ LIGHT ',
            };

        bgContainer.clear();
        bgContainer.fillStyle(colors.bgBoard, 1);
        bgContainer.fillRect(0, 0, BOARD_WIDTH, GAME_HEIGHT);

        uiBg.clear();
        uiBg.fillStyle(colors.uiBg, 1);
        uiBg.fillRect(BOARD_WIDTH, 0, CANVAS_WIDTH - BOARD_WIDTH, GAME_HEIGHT);
        uiBg.lineStyle(2 * SCALE, colors.border, 1);
        uiBg.strokeLineShape(new Phaser.Geom.Line(BOARD_WIDTH, 0, BOARD_WIDTH, GAME_HEIGHT));

        nextBox.clear();
        nextBox.lineStyle(2 * SCALE, colors.boxStroke, 1);
        nextBox.strokeRoundedRect(BOARD_WIDTH + 15 * SCALE, 105 * SCALE, 110 * SCALE, 110 * SCALE, 8 * SCALE);

        nextLabel.setColor(colors.label);
        scoreLabel.setColor(colors.label);
        highLabel.setColor(colors.label);

        scoreText.setColor(colors.scoreText);
        highScoreText.setColor(colors.highText);
        sausNameText.setColor(colors.nameText);

        themeBtnText.setText(colors.btnLabel);
        themeBtnText.setColor(colors.btnText);
        themeBtnText.setBackgroundColor(colors.btnBg);

        soundBtnText.setColor(colors.btnText);
        soundBtnText.setBackgroundColor(colors.btnBg);
      }

      function update(time, delta) {
        if (gameOver) return;

        if (canDrop && currentSausageSprite) {
          aimLine.clear();
          const lineColor = isDarkMode ? 0xffffff : 0x000000;
          aimLine.lineStyle(1 * SCALE, lineColor, 0.3);
          const startY = 60 * SCALE + SAUSAGE_TYPES[currentTypeIndex].radius;
          for (let y = startY; y < GAME_HEIGHT; y += 12 * SCALE) {
            aimLine.lineBetween(currentSausageSprite.x, y, currentSausageSprite.x, y + 6 * SCALE);
          }
        }

        const bodies = this.matter.world.getAllBodies();
        let isOverflowing = false;

        bodies.forEach((body) => {
          if (body.sausageTypeIndex !== undefined) {
            if (body.gameObject) {
              body.gameObject.x = body.position.x;
              body.gameObject.y = body.position.y;
              body.gameObject.rotation = body.angle;
            }

            if (body.speed < 0.3 * SCALE) {
              const topY = body.position.y - SAUSAGE_TYPES[body.sausageTypeIndex].radius;
              if (topY < GAME_OVER_LINE_Y) {
                isOverflowing = true;
              }
            }
          }
        });

        if (isOverflowing) {
          overflowTimer += delta;
          if (overflowTimer > 1500) {
            triggerGameOver(this);
          }
        } else {
          overflowTimer = 0;
        }
      }

      function getRandomNextIndex() {
        return Math.floor(Math.random() * 4);
      }

      function spawnNextSausage(scene) {
        currentTypeIndex = nextTypeIndex;
        nextTypeIndex = getRandomNextIndex();

        const typeInfo = SAUSAGE_TYPES[currentTypeIndex];
        if (sausNameText) sausNameText.setText(typeInfo.name);

        if (nextSausagePreview) nextSausagePreview.destroy();
        const nextInfo = SAUSAGE_TYPES[nextTypeIndex];
        nextSausagePreview = scene.add.image(BOARD_WIDTH + 70 * SCALE, 160 * SCALE, nextInfo.key);

        const maxPreviewSize = 80 * SCALE;
        const maxDimension = Math.max(nextSausagePreview.width, nextSausagePreview.height);
        nextSausagePreview.setScale(maxPreviewSize / maxDimension);

        currentSausageSprite = createPreviewSprite(scene, typeInfo);

        const activePointer = scene.input.activePointer;
        const worldPoint = scene.cameras.main.getWorldPoint(activePointer.x, activePointer.y);
        const currentRadius = typeInfo.radius;
        const minX = currentRadius + 5 * SCALE;
        const maxX = BOARD_WIDTH - currentRadius - 5 * SCALE;

        const initialX =
          activePointer && activePointer.x > 0 && worldPoint.x < BOARD_WIDTH
            ? Phaser.Math.Clamp(worldPoint.x, minX, maxX)
            : BOARD_WIDTH / 2;

        currentSausageSprite.x = initialX;
        currentSausageSprite.y = 60 * SCALE;
      }

      function createPreviewSprite(scene, typeInfo) {
        const sprite = scene.add.image(0, 0, typeInfo.key);
        const targetSize = typeInfo.radius * 2;
        const maxDim = Math.max(sprite.width, sprite.height);
        sprite.setScale(targetSize / maxDim);
        return sprite;
      }

      function createPhysicsSausage(scene, x, y, typeIndex) {
        const typeInfo = SAUSAGE_TYPES[typeIndex];
        const targetSize = typeInfo.radius * 2;

        const shapes = scene.cache.json.get('physics_shapes');
        const shapeData = shapes ? shapes[typeInfo.key] : null;

        let sprite;

        const commonOptions = {
          restitution: 0.05,
          friction: 0.5,
          frictionStatic: 1.0,
          density: 0.005,
          slop: 0.05 * SCALE,
        };

        if (shapeData) {
          sprite = scene.matter.add.sprite(x, y, typeInfo.key, null, {
            shape: shapeData,
            ...commonOptions,
          });

          const frame = scene.textures.getFrame(typeInfo.key);
          const maxDim = Math.max(frame.width, frame.height);
          const scale = targetSize / maxDim;

          sprite.setBody(shapeData, { scale: { x: scale, y: scale } });
          sprite.setScale(scale);
        } else {
          const tempTexture = scene.textures.get(typeInfo.key).getSourceImage();
          const aspect = tempTexture.width / tempTexture.height;

          let boxWidth, boxHeight;
          if (aspect >= 1) {
            boxWidth = targetSize;
            boxHeight = targetSize / aspect;
          } else {
            boxHeight = targetSize;
            boxWidth = targetSize * aspect;
          }

          const chamferRadius = Math.min(boxWidth, boxHeight) / 2;
          const body = scene.matter.add.rectangle(x, y, boxWidth, boxHeight, {
            chamfer: { radius: chamferRadius },
            ...commonOptions,
          });

          sprite = scene.add.image(x, y, typeInfo.key);
          sprite.setDisplaySize(boxWidth, boxHeight);
          body.gameObject = sprite;

          body.sausageTypeIndex = typeIndex;
          return body;
        }

        sprite.body.sausageTypeIndex = typeIndex;
        sprite.body.gameObject = sprite;

        return sprite.body;
      }

      function destroySausageBody(scene, body) {
        const gameObject = body.gameObject || (body.parent ? body.parent.gameObject : null);
        if (gameObject) {
          gameObject.destroy();
        }
        scene.matter.world.remove(body);
      }

      function triggerGameOver(scene) {
        gameOver = true;
        aimLine.clear();

        const overlay = scene.add.graphics();
        overlay.fillStyle(0x000000, 0.75);
        overlay.fillRect(0, 0, CANVAS_WIDTH, GAME_HEIGHT);

        scene.add.text(BOARD_WIDTH / 2 - 90 * SCALE, GAME_HEIGHT / 2 - 70 * SCALE, 'GAME OVER', {
          fontSize: `${32 * SCALE}px`,
          fill: '#ff4444',
          fontStyle: 'bold',
        });

        scene.add.text(BOARD_WIDTH / 2 - 60 * SCALE, GAME_HEIGHT / 2 - 20 * SCALE, 'Score: ' + score, {
          fontSize: `${22 * SCALE}px`,
          fill: '#ffffff',
        });

        const restartBtn = scene.add
          .text(BOARD_WIDTH / 2 - 65 * SCALE, GAME_HEIGHT / 2 + 40 * SCALE, ' REJOUER ', {
            fontSize: `${20 * SCALE}px`,
            fill: '#181412',
            backgroundColor: '#ffca28',
            padding: { x: 15 * SCALE, y: 10 * SCALE },
          })
          .setInteractive({ useHandCursor: true });

        restartBtn.on('pointerdown', () => {
          scene.scene.restart();
        });
      }
    </script>
  </body>
</html>
